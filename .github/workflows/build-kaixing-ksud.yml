# ============================================================
# 开星内核 · 定制 ksud 构建（零输入版）
#
# 没有任何 input，点 Run workflow 直接就跑，避免 dispatch 报错。
# 图案脚本以 base64 内嵌，粘贴时丢缩进也不影响。
#
# 行为固定为：
#   1. 先在 userspace/ksud/src 找图案，把找到的内容打进日志
#   2. 换成「开星内核」笑脸
#   3. 编译 aarch64 ksud
#   4. 产物：ksud + libksud.so
#
# 若日志里显示 total: 0，说明目录不对，改下面的 SCAN_DIR 一行即可。
# ============================================================
