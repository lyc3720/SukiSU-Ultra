# ============================================================
# 开星内核 · 定制 ksud 构建
#
# 目标：完全照抄你正在用的 ksud，只改一处 ——
#       把启动时打印的品牌图案换成「开星内核」的笑脸。
#
# 建议 fork 的仓库：ShirkNeko/SukiSU-Ultra
#   因为那个图案是 SukiSU Ultra 自己加的（官方 KernelSU 大概率没有），
#   fork 它才能保证：图案找得到 + 其余功能与你当前用的完全一致。
#
# 需要放进仓库的两个文件：
#   .github/workflows/build-kaixing-ksud.yml   （本文件）
#   scripts/patch_banner.py                    （改图案用的脚本）
#
# 用法：
#   1. Fork ShirkNeko/SukiSU-Ultra
#   2. 放进上面两个文件
#   3. Actions -> Build 开星内核 ksud -> Run workflow
#      第一次建议勾 scan_only，先确认能扫到图案
#   4. 下载产物里的 libksud.so，放进 App 工程重新编译
# ============================================================
name: Build 开星内核 ksud

on:
  workflow_dispatch:
    inputs:
      banner_mode:
        description: '启动时打印的图案怎么处理'
        required: true
        default: 'kaixing'
        type: choice
        options:
          # kaixing = 换成开星内核笑脸（推荐）
          # remove  = 直接删掉，什么都不打印
          # keep    = 保持原样，只编译不改
          - kaixing
          - remove
          - keep
      scan_only:
        description: '只扫描看看图案在哪，不编译'
        required: false
        default: false
        type: boolean
      scan_dir:
        description: '扫描哪个目录（找不到图案时可以试试整个 userspace）'
        required: false
        default: 'userspace/ksud/src'
        type: string

jobs:
  build:
    name: Build ksud (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:
          # build.rs 要靠 git 信息算版本号，必须拉全
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描图案在哪
        run: |
          echo "=========================================="
          echo " 扫描目录: ${{ inputs.scan_dir }}"
          echo "=========================================="
          python3 scripts/patch_banner.py scan "${{ inputs.scan_dir }}" || true
          echo
          echo "------------------------------------------"
          echo "如果显示「共处理 0 处」，换 scan_dir 再跑一次："
          echo "  userspace                 整个用户空间"
          echo "  userspace/ksud            含 Cargo 配置"
          echo "  manager/app/src/main/java 万一在管理器里"
          echo "------------------------------------------"

      - name: 替换图案
        if: ${{ !inputs.scan_only && inputs.banner_mode != 'keep' }}
        run: |
          echo "[i] 执行替换：${{ inputs.banner_mode }}"
          python3 scripts/patch_banner.py "${{ inputs.banner_mode }}" "${{ inputs.scan_dir }}"
          echo
          echo "替换后的样子："
          python3 scripts/patch_banner.py scan "${{ inputs.scan_dir }}" || true

      - name: 只扫描就到此为止
        if: ${{ inputs.scan_only }}
        run: echo "[i] 扫描模式，不编译"

      # ---------------- 以下开始编译 ----------------
      - name: 装 Rust
        if: ${{ !inputs.scan_only }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 依赖
        if: ${{ !inputs.scan_only }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud

      - name: 装 cross（官方同款交叉编译工具）
        if: ${{ !inputs.scan_only }}
        run: |
          RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: 准备 LKM 目录
        if: ${{ !inputs.scan_only }}
        run: |
          # 官方构建会把 ko 嵌进 ksud；我们不需要内置 ko
          # （修补时用 -m 指定自己的），但目录得存在否则可能报错
          mkdir -p userspace/ksud/bin/aarch64
          mkdir -p userspace/ksud/bin/x86_64

      - name: 编译 ksud
        if: ${{ !inputs.scan_only }}
        working-directory: userspace/ksud
        run: |
          echo "=== 图案模式 : ${{ inputs.banner_mode }} ==="
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release

      - name: 收集产物
        if: ${{ !inputs.scan_only }}
        run: |
          mkdir -p out
          SRC=userspace/ksud/target/aarch64-linux-android/release/ksud
          if [ -f "$SRC" ]; then
            cp "$SRC" out/ksud
          else
            echo "[!] 常规路径没找到，全盘找一下"
            cp "$(find . -type f -name ksud | head -1)" out/ksud
          fi
          cp out/ksud out/libksud.so
          chmod 755 out/ksud out/libksud.so
          ls -la out/
          file out/ksud || true

      - name: 上传 ksud
        if: ${{ !inputs.scan_only }}
        uses: actions/upload-artifact@v4
        with:
          name: kaixing-ksud
          path: |
            out/ksud
            out/libksud.so
          retention-days: 90
