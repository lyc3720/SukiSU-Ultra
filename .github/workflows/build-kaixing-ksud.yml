        run: |
          mkdir -p scripts
          printf '%s' "$B64" | tr -d ' \n' | base64 -d > scripts/patch_banner.py
          python3 -c "import ast;ast.parse(open('scripts/patch_banner.py',encoding='utf-8').read());print('script ok')"
          wc -l scripts/patch_banner.py

      - name: 扫描并替换图案
        env:
          SCAN_DIR: userspace/ksud/src
        run: |
          echo "=== 扫描 $SCAN_DIR ==="
          python3 scripts/patch_banner.py scan "$SCAN_DIR" || true
          echo "=== 替换为开星内核 ==="
          python3 scripts/patch_banner.py kaixing "$SCAN_DIR" || true
          echo "=== 替换后 ==="
          python3 scripts/patch_banner.py scan "$SCAN_DIR" || true

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud

      - name: 装 cross
        run: RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: 准备 LKM 目录
        run: mkdir -p userspace/ksud/bin/aarch64 userspace/ksud/bin/x86_64

      - name: 编译 ksud
        working-directory: userspace/ksud
        run: CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release

      - name: 收集产物
        run: |
          mkdir -p out
          SRC=userspace/ksud/target/aarch64-linux-android/release/ksud
          if [ -f "$SRC" ]; then cp "$SRC" out/ksud; else cp "$(find . -type f -name ksud | head -1)" out/ksud; fi
          cp out/ksud out/libksud.so
          chmod 755 out/ksud out/libksud.so
          ls -la out/
          file out/ksud || true

      - name: 上传 ksud
        uses: actions/upload-artifact@v4
        with:
          name: kaixing-ksud
          path: |
            out/ksud
            out/libksud.so
          retention-days: 90
